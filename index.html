<body>
    <div class="lang-switcher">
        <button id="lang-btn" aria-label="Toggle language">తెలుగు | <span>EN</span></button>
    </div>
    
    <div class="invitation-container">
        <div class="border-overlay"></div>
        
        <div class="invitation-card">
            <div class="ganesha-container">
                <img src="assets/ganesha.svg" alt="Lord Ganesha" class="ganesha-icon">
            </div>
            
            <div id="content-container">
                <!-- Content injected via JS -->
            </div>
            
            <div class="divider">
                <svg width="150" height="20" viewBox="0 0 150 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 10 H65 M85 10 H140" stroke="#A78343" stroke-width="1"/>
                    <circle cx="75" cy="10" r="4" fill="#C6A66A"/>
                    <circle cx="75" cy="10" r="2" fill="#FAF7F0"/>
                </svg>
            </div>
            
            <div class="action-buttons">
                <button id="btn-calendar" class="btn-primary" aria-label="Add to Calendar">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="label-calendar">గూగుల్ క్యాలెండర్‌లో జోడించండి</span>
                </button>
                
                <button id="btn-maps" class="btn-primary" aria-label="Google Maps">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span id="label-maps">గూగుల్ మ్యాప్స్</span>
                </button>
                
                <button id="btn-copy" class="btn-secondary" aria-label="Copy Link">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span id="label-copy">లింక్ కాపీ చేయండి</span>
                </button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden">లింక్ కాపీ చేయబడింది!</div>

    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/app.js"></script>
